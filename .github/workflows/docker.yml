# /.github/workflows/docker.yml
# Baut ghcr.io/pavl21/nginx-ptero für PHP 8.2, 8.3, 8.4, 8.5
# Alle Tags nutzen Dockerfile auf Basis der offiziellen
# php:${PHP_VER}-fpm-alpine Images (Minor-Tag schwimmend).
# PHP 8.1 wird nicht mehr gebaut (kein Sicherheitssupport mehr seit 31.12.2025);
# das bestehende Tag 8.1 auf ghcr.io bleibt unverändert stehen.
# Trigger: Push auf main, wöchentlich (Patch-Updates der Basis-Images)
# oder manuell über "Run workflow"

name: Build & Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker.yml'
  workflow_dispatch:
  schedule:
    # Wöchentlich Montag 04:00 UTC: holt Patch-Versionen der offiziellen
    # PHP-Basis-Images (z. B. Sicherheitsfixes) automatisch nach.
    - cron: '0 4 * * 1'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: pavl21/nginx-ptero

jobs:
  build:
    name: PHP ${{ matrix.php_ver }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        php_ver: ["8.2", "8.3", "8.4", "8.5"]

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Image-Metadaten ermitteln
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.php_ver }}

      - name: Image bauen und pushen
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PHP_VER=${{ matrix.php_ver }}
          cache-from: type=gha,scope=php-${{ matrix.php_ver }}
          cache-to:   type=gha,scope=php-${{ matrix.php_ver }},mode=max
